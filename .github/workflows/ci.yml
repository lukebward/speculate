name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc
      - run: npm test
      - name: Install Codex for native integration checks
        run: npm install --global @openai/codex@0.153.4
      - name: Check native Codex setup and MCP calls
        run: npm test -- test/codex-real-e2e.test.ts
        env:
          SPECULATE_REAL_CODEX_TEST: '1'
